apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-dev-root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Steel-yong/Infra-gitops'
    targetRevision: onprem-dev-test
    path: 'applicationsets/onprem-dev'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true