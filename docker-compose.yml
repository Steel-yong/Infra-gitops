services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pubg_helper
      POSTGRES_USER: pubg_helper
      POSTGRES_PASSWORD: pubg_helper_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubg_helper"]
      interval: 5s
      timeout: 5s
      retries: 5

  capture:
    build:
      context: .
      dockerfile: apps/services/capture/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001

  location:
    build:
      context: .
      dockerfile: apps/services/location/Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://pubg_helper:pubg_helper_local@postgres:5432/pubg_helper
    depends_on:
      postgres:
        condition: service_healthy

  alert:
    build:
      context: .
      dockerfile: apps/services/alert/Dockerfile
    ports:
      - "3003:3003"
    environment:
      PORT: 3003

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CAPTURE_SERVICE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_LOCATION_SERVICE_URL: http://127.0.0.1:3002
      NEXT_PUBLIC_ALERT_SERVICE_URL: http://127.0.0.1:3003
      # 어드민 페이지 게이트 비번 (서버 전용 — NEXT_PUBLIC 아님).
      # 기본값 없음 — 미설정 시 /admin 잠김(fail-closed). 운영/개발 모두 시크릿·.env로 주입.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

volumes:
  postgres_data:
