services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pubg_helper
      POSTGRES_USER: pubg_helper
      POSTGRES_PASSWORD: pubg_helper_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubg_helper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
