function tier(n){return n>=10?'s':(n>=5?'a':'b')}
let filter='all';
function render(){
  const m=document.getElementById('map');
  m.querySelectorAll('.mk').forEach(e=>e.remove());
  let cnt=0,s=0,a=0,b=0;
  DATA.hotspots.forEach((h,i)=>{
    const t=tier(h.match_count);
    if(filter==='s'&&t!=='s')return;
    if(filter==='a'&&t!=='a')return;
    if(filter==='top20'&&i>=20)return;
    if(filter==='ridge'&&h.label!=='능선/호')return;
    if(filter==='outer'&&h.label!=='외곽 작은 마을')return;
    if(filter==='cities')return;
    const el=document.createElement('div');
    el.className='mk '+t;
    el.style.left=(h.gx*100)+'%';el.style.top=(h.gy*100)+'%';
    el.title='('+h.gx.toFixed(3)+','+h.gy.toFixed(3)+') '+t.toUpperCase()+' 매치'+h.match_count+' 마커'+h.marker_count+' 도시영향'+h.city_influence+' '+h.label;
    m.appendChild(el);cnt++;
    if(t==='s')s++;else if(t==='a')a++;else b++;
  });
  if(filter==='cities'||filter==='all'){
    DATA.cities.forEach(c=>{
      const el=document.createElement('div');el.className='mk city';
      el.style.left=(c.gx*100)+'%';el.style.top=(c.gy*100)+'%';
      el.title='대도시 ('+c.gx.toFixed(2)+','+c.gy.toFixed(2)+') '+c.markers+'마커';
      m.appendChild(el);
    });
  }
  document.getElementById('n_total').textContent=DATA.hotspots.length;
  document.getElementById('n_s').textContent=DATA.hotspots.filter(h=>tier(h.match_count)==='s').length;
  document.getElementById('n_a').textContent=DATA.hotspots.filter(h=>tier(h.match_count)==='a').length;
  document.getElementById('n_b').textContent=DATA.hotspots.filter(h=>tier(h.match_count)==='b').length;
}
function fillTable(){
  const tb=document.getElementById('tbody');
  DATA.hotspots.slice(0,80).forEach((h,i)=>{
    const t=tier(h.match_count).toUpperCase();
    tb.innerHTML+='<tr><td>'+(i+1)+'</td><td><code>('+h.gx.toFixed(3)+','+h.gy.toFixed(3)+')</code></td><td class="tier-'+t+'">'+t+'</td><td>'+h.match_count+'</td><td>'+h.marker_count+'</td><td>'+h.label+'</td></tr>';
  });
}
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',e=>{
  document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');filter=b.dataset.f;render();
}));
render();fillTable();
</script></div></body></html>
