name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @pubg-helper/location exec prisma generate

      - name: Type check (shared)
        run: pnpm --filter @pubg-helper/shared exec tsc --noEmit

      - name: Type check (capture)
        run: pnpm --filter @pubg-helper/capture exec tsc --noEmit

      - name: Type check (location)
        run: pnpm --filter @pubg-helper/location exec tsc --noEmit

      - name: Type check (alert)
        run: pnpm --filter @pubg-helper/alert exec tsc --noEmit

      - name: Type check (frontend)
        run: pnpm --filter @pubg-helper/frontend exec tsc --noEmit

  test-capture:
    name: Test (capture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm --filter @pubg-helper/capture test:coverage

  test-location:
    name: Test (location)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @pubg-helper/location exec prisma generate

      - name: Test with coverage
        run: pnpm --filter @pubg-helper/location test:coverage

  test-alert:
    name: Test (alert)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm --filter @pubg-helper/alert test:coverage

  test-frontend:
    name: Test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm --filter @pubg-helper/frontend test:coverage

  coverage-gate:
    name: Coverage Gate (95%)
    runs-on: ubuntu-latest
    needs:
      - test-capture
      - test-location
      - test-alert
      - test-frontend
    steps:
      - name: All coverage checks passed
        run: echo "모든 워크스페이스 커버리지 95% 이상 통과"
