apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - external-secret-grafana.yaml
  - httproute.yaml

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
- name: grafana-dashboard-node-exporter
  files:
  - dashboards/node-exporter.json
- name: grafana-dashboard-kube-state-metrics
  files:
  - dashboards/kube-state-metrics.json
- name: grafana-dashboard-argocd
  files:
  - dashboards/argocd.json
- name: grafana-dashboard-k8s-cluster
  files:
  - dashboards/k8s-cluster.json
- name: grafana-dashboard-longhorn
  files:
  - dashboards/longhorn.json
- name: grafana-dashboard-cert-manager
  files:
  - dashboards/cert-manager.json