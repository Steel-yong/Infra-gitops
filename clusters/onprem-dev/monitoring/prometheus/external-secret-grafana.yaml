apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
  dataFrom:
  - extract:
      key: grafana
      conversionStrategy: Default	
      decodingStrategy: None
      metadataPolicy: None