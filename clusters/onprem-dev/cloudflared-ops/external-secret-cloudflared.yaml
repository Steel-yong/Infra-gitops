apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-ops-token
  namespace: cloudflared
spec:
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: cloudflared-ops-token
  dataFrom:
    - extract:
        key: cloudflared-ops