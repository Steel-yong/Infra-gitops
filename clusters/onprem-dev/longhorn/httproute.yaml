apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  parentRefs:
  - name: public-gateway
    namespace: gateway
  hostnames:
  - longhorn.yongun.shop
  rules:
    - backendRefs:
      - name: longhorn-frontend
        port: 80