podDisruptionBudget:
  minAvailable: 1
deployment:
  replicas: 2
  pod:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: envoy-gateway
            app.kubernetes.io/instance: envoy-gateway