apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: main-ad
  namespace: metallb
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  ipAddressPools:
  - infra-pool
  - dynamic-pool

---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: infra-pool
  namespace: metallb
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  addresses:
  - 0.0.0.0/24
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: dynamic-pool
  namespace: metallb
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  addresses:
  - 0.0.0.0/24