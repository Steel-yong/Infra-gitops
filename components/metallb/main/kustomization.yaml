apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pool-template.yaml 
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.15.3
    releaseName: metallb-main
    namespace: metallb
    valuesInline:
      namespaceOverride: "metallb" 
      crds:
        enabled: false     
      controller:
        enabled: true      
      speaker:
        enabled: true      

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"