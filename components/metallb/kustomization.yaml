apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pool-template.yaml

helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.15.3
    releaseName: metallb-crd
    namespace: metallb
    valuesInline:
      crds:
        enabled: true
      controller:
        priorityClassName: system-cluster-critical
      speaker:
        priorityClassName: system-cluster-critical

patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=controller
      namespace: metallb
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  