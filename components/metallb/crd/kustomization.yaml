apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metalLB

helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.15.3
    releaseName: metallb-crd
    namespace: metallb
    valuesInline:
    crds:
      enabled: true
    controller:
      enabled: false
    controller:
      enabled: false
    
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-5"